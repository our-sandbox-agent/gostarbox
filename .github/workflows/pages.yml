name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Render smoke (headless Chrome against vite preview)
        run: bash scripts/ci-smoke.sh /gostarbox/
      # tests-only gate (no live smoke): the deploy job only needs to refuse
      # shipping a demo whose server contract broke; the live cycle already
      # ran in CI on the same commit
      - name: Server typecheck and tests
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
