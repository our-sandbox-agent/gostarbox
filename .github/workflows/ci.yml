name: Validate pull request
on:
  pull_request:
    branches: [main, develop, 'feat/**']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the gvisor evidence tests run `git archive` against
          # the pinned measurement commits (same requirement as
          # gvisor-preflight.yml's fetch-depth: 0)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -m compileall -q scripts diagnostics
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Render smoke (headless Chrome against vite preview)
        run: bash scripts/ci-smoke.sh /gostarbox/
      # plain npm ci without cache config: setup-node's npm cache hashes the
      # root lockfile only; a server-specific cache-dependency-path is not
      # worth it for this dependency footprint
      - name: Server typecheck and tests
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Server contract smoke (live HTTP, in-memory adapter)
        run: bash scripts/ci-server-smoke.sh
